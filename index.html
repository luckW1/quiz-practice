<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="题库练习">
<title>题库随机练习</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="assets/style.css?v=2">
</head>
<body>
<header class="mobilebar">
  <span class="mtitle">题库练习</span>
  <button class="mbtn" id="menuBtn">筛选 / 统计</button>
</header>
<div class="scrim" id="scrim"></div>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">题</div>
      <div class="brand-text">
        <h1>题库随机练习</h1>
        <p id="bankTotal">共 0 题</p>
      </div>
      <button class="closeBtn" id="closeMenu">完成</button>
    </div>

    <section class="panel">
      <h2>题库</h2>
      <div class="chips" id="bankChips"></div>
    </section>

    <section class="panel">
      <h2>题型</h2>
      <div class="chips" id="typeChips"></div>
    </section>

    <section class="panel">
      <h2>练习方式</h2>
      <div class="seg" id="modeSeg">
        <button data-mode="random" class="active">随机</button>
        <button data-mode="order">顺序</button>
      </div>
      <label class="switch">
        <input type="checkbox" id="onlyWrong">
        <span>只练错题</span>
      </label>
    </section>

    <section class="panel">
      <h2>练习统计</h2>
      <div class="stat-row"><span>已练</span><b id="stDone">0</b></div>
      <div class="stat-row"><span>正确率</span><b id="stRate">—</b></div>
      <div class="stat-row"><span>错题</span><b id="stWrong">0</b></div>
      <button class="ghost" id="resetBtn">重置练习记录</button>
    </section>

    <p class="tips">快捷键：A/B/C/D 选答案，Enter 提交或下一题</p>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="progress"><div id="bar"></div></div>
      <div class="pos"><span id="posNow">0</span> / <span id="posAll">0</span></div>
    </header>

    <section class="card" id="card">
      <div class="meta">
        <span class="tag src" id="qSrc"></span>
        <span class="tag type" id="qType"></span>
        <span class="tag no" id="qNo"></span>
      </div>
      <div class="stem" id="qStem"></div>
      <div class="answer-area" id="qArea"></div>
      <div class="feedback" id="qFeedback" hidden></div>
    </section>

    <footer class="navbar">
      <button id="prevBtn">上一题</button>
      <button id="randBtn">随机一题</button>
      <button id="nextBtn" class="primary">下一题</button>
    </footer>
  </main>
</div>
<script src="assets/data.js?v=2"></script>
<script src="assets/app.js?v=2"></script>
</body>
</html>
